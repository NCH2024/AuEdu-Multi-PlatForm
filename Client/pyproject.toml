[project]
name = "auedu"
version = "0.2.12"
description = "AuEdu attendance client"
dependencies = [
    "flet==0.85.0",
    "flet-audio==0.85.0",
    "flet-camera==0.85.0",
    "flet-webview==0.85.0",
    "flet-geolocator==0.85.0",
    "flet-charts==0.85.0",
    "httpx",
    "requests",
    "websockets",
    "python-dotenv",
]

[tool.flet]
product = "AuEdu"
artifact = "AuEdu"
company = "NCH2024"
copyright = "Copyright (C) 2026 NCH2024"
permissions = ["camera", "location"]

# Legacy names kept for compatibility with the previous project setup.
project_name = "auedu"
product_name = "AuEdu"
main_module = "main"
assets_dir = "assets"

[tool.flet.app]
path = "."
module = "main"

[tool.flet.splash]
color = "#ffffff"

[tool.flet.android]
org = "com.nch2024"
bundle_id = "com.nch2024.auedu"
package_name = "com.nch2024.auedu"
version_code = 12
version_name = "0.2.12"
icon = "icon.png"
splash_image = "splash.png"
splash_color = "#ffffff"

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.INTERNET" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

[tool.flet.windows]
artifact = "AuEdu"

[tool.flet.ios]
bundle_id = "com.hiep.auedu"
icon = "icon.png"

[tool.flet.ios.info]
"NSCameraUsageDescription" = "Ung dung can quyen Camera de diem danh sinh vien."
"NSLocationWhenInUseUsageDescription" = "Ung dung can quyen Vi tri de ghi nhan dia diem khi diem danh."
